apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-hello-depl
  labels:
    app: java-hello
spec:
  replicas: 1
  selector:
    matchLabels: 
      app: java-hello
  template:
    metadata:
      labels:
        app: java-hello
    spec:
      containers:
      - name: java-hello-cont
        image: tanmayeedhakate/java-hello-world-v3:latest
        imagePullPolicy: Always
